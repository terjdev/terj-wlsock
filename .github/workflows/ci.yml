name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: rust:1
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Clippy
        run: rustup component add clippy
      - name: Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --features all
      - name: Test
        run: cargo test --locked --features all
