[package]
name = "terj-wlsock"
version = "1.0.0"
edition = "2024"
license = "MIT"

[features]
default = ["ext", "wlr"]
ext = ["ext-tablet", "ext-xdg-shell", "ext-dmabuf", "ext-presentation-time", "ext-viewporter"]
wlr = ["wlr-screencopy", "wlr-virtual-pointer", "wlr-data-control", "wlr-layer-shell"]
ext-presentation-time = []
ext-viewporter = []
wlr-data-control = []
wlr-layer-shell = []
wlr-screencopy = []
wlr-virtual-pointer = []
ext-tablet = []
ext-xdg-shell = []
ext-dmabuf = []

[dependencies]
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { version = "1", features = ["net", "time"] }
thiserror = "2"
