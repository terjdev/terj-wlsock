[package]
name = "terj-wlsock"
version = "1.0.0"
edition = "2024"
license = "MIT"

[features]
default = ["ext-presentation-time", "ext-viewporter"]
ext-presentation-time = []
ext-viewporter = []

[dependencies]
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { version = "1", features = ["net", "time"] }
thiserror = "2"
